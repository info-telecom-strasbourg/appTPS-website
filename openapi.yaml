      operationId: changeAvatar
      description: "Upload an image and replace the current user's avatar with it."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Avatar uploaded successfully'
                properties:
                  message:
                    type: string
                    example: 'Avatar uploaded successfully'
      tags:
        - User
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                  description: 'Must be an image. Must not be greater than 2048 kilobytes.'
                  nullable: false
              required:
                - avatar
